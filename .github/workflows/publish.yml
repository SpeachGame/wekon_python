# Публикует пакет на PyPI без хранения токена в репозитории. Запускается вручную.
name: Публикация на PyPI

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Сборка
        run: |
          pip install build
          python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
